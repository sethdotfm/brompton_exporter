# tessera_exporter DOCKER COMPOSE // Version 1.0
# https://github.com/sethdotfm/tessera_exporter
services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./targets:/etc/prometheus/tessera_targets:ro
    restart: unless-stopped

  tessera-exporter:
    image: ghcr.io/sethdotfm/tessera_exporter:latest
    container_name: tessera-exporter
    ports:
      - "127.0.0.1:19800:19800"
    volumes:
      - ./tessera_exporter_config.yml:/app/tessera.yml:ro
      - ./targets:/app/targets:ro
    restart: unless-stopped

volumes:
  grafana-data:
  prometheus-data:
