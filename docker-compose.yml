# tessera_exporter DOCKER COMPOSE // Version 1.0
# https://github.com/sethdotfm/tessera_exporter
services:
#   ▼▼▼ ADD THESE LINES TO YOUR DOCKER COMPOSE FILE'S 'services:' SECTION ▼▼▼
  tessera-exporter:
    image: ghcr.io/sethdotfm/tessera_exporter:latest
    ports:
      - "19800:19800"
    volumes:
      - ./tessera.yml:/app/tessera.yml:ro
      - ./targets:/app/targets:ro
    restart: unless-stopped
#   ▲▲▲ That's it! ▲▲▲

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./targets:/etc/prometheus/targets:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped
    depends_on:
      - tessera-exporter

  # ▼▼▼ Syslog: catches Tessera's UDP syslog, filters junk, stores it in ▼▼▼
  # ▼▼▼ Loki, and shows it in Grafana. Point your processor's syslog     ▼▼▼
  # ▼▼▼ target at <this_host>:514.                                      ▼▼▼
  alloy:
    image: grafana/alloy:latest
    ports:
      - "514:1514/udp"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "/etc/alloy/config.alloy"
    restart: unless-stopped
    depends_on:
      - loki

  loki:
    image: grafana/loki:latest
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    depends_on:
      - loki
#   ▲▲▲ That's it! ▲▲▲

volumes:
  alloy-data:
  loki-data:
  grafana-data:
