# tessera_exporter DOCKER COMPOSE // Version 1.0
# https://github.com/sethdotfm/tessera_exporter
services:
#   ▼▼▼ ADD THESE LINES TO YOUR DOCKER COMPOSE FILE'S 'services:' SECTION ▼▼▼
  tessera-exporter:
    build: .
    ports:
      - "19800:19800"
    volumes:
      - ./tessera.yml:/app/tessera.yml:ro
      - ./targets:/app/targets:ro
    restart: unless-stopped
#   ▲▲▲ That's it! ▲▲▲

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./targets:/etc/prometheus/targets:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped
    depends_on:
      - tessera-exporter
