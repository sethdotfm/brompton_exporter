# tessera_exporter prometheus.yml // Version 1.1.0
# https://github.com/sethdotfm/tessera_exporter
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
#   ▼▼▼ ADD THESE LINES TO YOUR PROMETHEUS CONFIGURATION FILE'S 'scrape_configs' SECTION ▼▼▼
  # https://github.com/sethdotfm/tessera_exporter
  - job_name: tessera
    scrape_interval: 30s # Brompton officially recommends polling no faster than every 30s
    metrics_path: /probe
    file_sd_configs:
      - files:
          - targets/tessera.yml
    relabel_configs:
      # Pass the target address to the exporter as the 'target' param
      - source_labels: [__address__]
        target_label: __param_target

      # Set the instance label to just the host, without the port
      - source_labels: [__param_target]
        target_label: instance
        regex: "([^:]+)(:\\d+)?"
        replacement: "$1"

      # Friendly display label for the Grafana dashboards: "<ip> - <location>",
      # falling back to bare "<ip>" for targets with no location label.
      # Identity (serial, processor name) is only known from tessera_info, which
      # a processor stops publishing the moment it goes offline. Keying the
      # dashboards on this target label instead means an unreachable processor
      # still gets a row.
      - source_labels: [instance, location]
        separator: " - "
        regex: "(.+) - (.+)"
        target_label: processor
        replacement: "$1 - $2"
      - source_labels: [processor, instance]
        separator: ";"
        regex: ";(.+)"
        target_label: processor
        replacement: "$1"

      # Route all probes through the exporter
      - target_label: __address__
        replacement: "tessera-exporter:19800"

  # tessera_exporter telemetry
  - job_name: tessera_exporter
    static_configs:
      - targets: ["tessera-exporter:19800"]
#   ▲▲▲ That's it! ▲▲▲
