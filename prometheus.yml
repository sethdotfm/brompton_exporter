global:
  scrape_interval: 30s   # Brompton recommends infrequent polling of live video hardware
  evaluation_interval: 30s

scrape_configs:
  - job_name: tessera
    metrics_path: /probe
    params:
      # No additional params needed
    file_sd_configs:
      - files:
          - targets/tessera.yml
    relabel_configs:
      # Pass the target address to the exporter as the 'target' param
      - source_labels: [__address__]
        target_label: __param_target

      # Set the instance label to just the host, without the port
      - source_labels: [__param_target]
        target_label: instance
        regex: "([^:]+)(:\\d+)?"
        replacement: "$1"

      # Route all probes through the exporter
      - target_label: __address__
        replacement: "127.0.0.1:19800"

  # Exporter self-instrumentation
  - job_name: tessera_exporter
    static_configs:
      - targets: ["127.0.0.1:19800"]
